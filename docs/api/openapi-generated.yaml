components:
  schemas:
    AccessMode:
      type: string
      enum:
      - restricted
      - link
      title: AccessMode
    ApiError:
      properties:
        detail:
          type: string
          title: Detail
          description: Коротке пояснення помилки.
      type: object
      required:
      - detail
      title: ApiError
      description: Стандартна відповідь API з помилкою.
    AuthResponse:
      properties:
        access_token:
          type: string
          title: Access Token
          description: 'Токен сесії. Передавайте його в заголовку Authorization: Bearer
            <токен>.'
        token_type:
          type: string
          const: bearer
          title: Token Type
          description: Тип токена (RFC 6750).
          default: bearer
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: Абсолютний кінець сесії в UTC. Після 30 хвилин бездіяльності
            сесія завершується раніше.
        user:
          $ref: '#/components/schemas/UserResponse'
          description: Автентифікований користувач.
      type: object
      required:
      - access_token
      - expires_at
      - user
      title: AuthResponse
      description: Результат реєстрації або входу.
    DocumentCreate:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Title
          description: Назва документа. Якщо її не вказано, використовується «Без
            назви».
          examples:
          - План проєкту
      type: object
      title: DocumentCreate
      description: Поля для створення документа.
    DocumentResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Унікальний ідентифікатор документа.
          examples:
          - 1
        title:
          type: string
          title: Title
          description: Назва документа.
          examples:
          - Нотатки команди
        access_mode:
          $ref: '#/components/schemas/AccessMode'
          description: Режим доступу до документа.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Час створення документа в UTC.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Час останньої зміни документа в UTC.
        deleted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deleted At
          description: Час переміщення документа до кошика; null для активного документа.
      type: object
      required:
      - id
      - title
      - access_mode
      - created_at
      - updated_at
      title: DocumentResponse
      description: Документ, що повертається API.
    DocumentUpdate:
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 1
          title: Title
          description: 'Нова назва документа: від 1 до 100 символів.'
          examples:
          - Оновлений план проєкту
      type: object
      required:
      - title
      title: DocumentUpdate
      description: Поля для перейменування документа.
    DocumentsResponse:
      properties:
        documents:
          items:
            $ref: '#/components/schemas/DocumentResponse'
          type: array
          title: Documents
          description: Документи на поточній сторінці.
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
          description: Метадані пагінації.
      type: object
      required:
      - documents
      - pagination
      title: DocumentsResponse
      description: Сторінка активних документів.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        email:
          type: string
          maxLength: 254
          title: Email
          examples:
          - olena@example.com
        password:
          type: string
          maxLength: 128
          title: Password
          examples:
          - correct-horse-battery
      type: object
      required:
      - email
      - password
      title: LoginRequest
      description: Дані для входу.
    MemberResponse:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        email:
          type: string
          title: Email
        name:
          type: string
          title: Name
        role:
          $ref: '#/components/schemas/Role'
      type: object
      required:
      - user_id
      - email
      - name
      - role
      title: MemberResponse
      description: Учасник документа.
    MembersResponse:
      properties:
        members:
          items:
            $ref: '#/components/schemas/MemberResponse'
          type: array
          title: Members
      type: object
      required:
      - members
      title: MembersResponse
      description: Усі учасники документа, включно з власником.
    PaginationInfo:
      properties:
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          description: Максимальна кількість елементів у відповіді.
        offset:
          type: integer
          minimum: 0.0
          title: Offset
          description: Кількість пропущених елементів.
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Загальна кількість елементів.
        has_more:
          type: boolean
          title: Has More
          description: Чи є елементи на наступній сторінці.
      type: object
      required:
      - limit
      - offset
      - total
      - has_more
      title: PaginationInfo
      description: Метадані пагінації списку.
    ParagraphCreate:
      properties:
        content:
          type: string
          maxLength: 10000
          title: Content
          description: Текст абзацу (до 10 000 символів). Порожній текст дозволений
            для порожнього абзацу.
          examples:
          - Текст першого абзацу
        position:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Position
          description: Нульова позиція вставлення; якщо не вказано, абзац додається
            в кінець.
          examples:
          - 0
      type: object
      required:
      - content
      title: ParagraphCreate
      description: Поля для додавання абзацу в кінець документа або у вказану позицію.
    ParagraphResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Унікальний ідентифікатор абзацу.
          examples:
          - 1
        document_id:
          type: integer
          title: Document Id
          description: Ідентифікатор документа-власника.
          examples:
          - 1
        position:
          type: integer
          minimum: 0.0
          title: Position
          description: Позиція абзацу, починаючи з нуля.
          examples:
          - 0
        content:
          type: string
          title: Content
          description: Текст абзацу.
          examples:
          - Текст документа
      type: object
