              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Керувати доступом може лише власник документа.
          content:
            application/json:
              example:
                detail: Недостатньо прав для цієї дії.
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Вхідні дані не пройшли валідацію.
          content:
            application/json:
              example:
                detail: Некоректні вхідні дані.
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
      - access
      summary: Поділитися документом або змінити роль
      description: Надає зареєстрованому користувачу роль editor або guest (FR-040).
        Повторний виклик для того самого email змінює роль (FR-043). Лише для власника
