  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Зареєструватися
      description: Створює обліковий запис і одразу відкриває сесію (FR-001, FR-002,
        US-003). Email нормалізується до нижнього регістру.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Акаунт створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email уже використовується.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                detail: Користувач із таким email уже зареєстрований.
        '422':
          description: Некоректний email, ім'я або пароль коротший за 8 символів.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                detail: Пароль має містити щонайменше 8 символів.
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Увійти
      description: Перевіряє email і пароль та створює сесію (FR-003). Помилка не
        уточнює, яке поле неправильне (FR-004). Після 5 невдалих спроб поспіль вхід
        блокується на 15 хвилин, а на email надсилається посилання для розблокування
        (FR-005).
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Вхід виконано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Невірна пара email/пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                detail: Невірний email або пароль
        '423':
          description: Вхід тимчасово заблоковано. Заголовок Retry-After містить кількість
            секунд до розблокування.
          headers:
            Retry-After:
              description: Секунд до автоматичного розблокування.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                detail: Вхід тимчасово заблоковано через кілька невдалих спроб. Спробуйте
                  пізніше або скористайтеся посиланням з листа.
        '422':
          description: Вхідні дані не пройшли валідацію.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                detail: Некоректні вхідні дані.
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Вийти
      description: 'Завершує поточну сесію на сервері: токен стає недійсним одразу
        (FR-006).'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Сесію завершено.
        '401':
          description: 'Не автентифіковано: відсутній або недійсний токен.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                detail: Потрібна автентифікація.
      security:
      - HTTPBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Поточний користувач
      description: Повертає дані власника токена сесії.
      operationId: read_current_user_api_v1_auth_me_get
      responses:
        '200':
          description: Користувача визначено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 'Не автентифіковано: відсутній або недійсний токен.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                detail: Потрібна автентифікація.
      security:
      - HTTPBearer: []
  /api/v1/auth/unlock:
    post:
      tags:
      - auth
      summary: Розблокувати акаунт за посиланням з листа
      description: 'Знімає тимчасове блокування входу за одноразовим токеном із листа
        (FR-005). Публічний маршрут: токен сам підтверджує право на дію.'
      operationId: unlock_api_v1_auth_unlock_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
        required: true
      responses:
        '204':
          description: Акаунт розблоковано.
        '400':
          description: Токен невідомий, уже використаний або застарілий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                detail: Посилання для розблокування недійсне або застаріле.
        '422':
          description: Вхідні дані не пройшли валідацію.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                detail: Некоректні вхідні дані.
