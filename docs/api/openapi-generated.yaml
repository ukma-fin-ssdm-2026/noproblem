          title: Limit
        description: Максимальна кількість документів у відповіді.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Кількість документів кошика, які потрібно пропустити.
          examples:
          - 0
          default: 0
          title: Offset
        description: Кількість документів кошика, які потрібно пропустити.
      responses:
        '200':
          description: Кошик отримано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResponse'
        '401':
          description: 'Не автентифіковано: відсутній або недійсний токен.'
          content:
            application/json:
              example:
                detail: Потрібна автентифікація.
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Недостатньо прав для виконання цієї дії.
          content:
            application/json:
              example:
                detail: Недостатньо прав для цієї дії.
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Вхідні дані не пройшли валідацію.
          content:
            application/json:
              example:
                detail: Некоректні вхідні дані.
              schema:
                $ref: '#/components/schemas/ApiError'
