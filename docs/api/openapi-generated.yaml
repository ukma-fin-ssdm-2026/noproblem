        '401':
          description: 'Не автентифіковано: відсутній або недійсний токен.'
          content:
            application/json:
              example:
                detail: Потрібна автентифікація.
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Керувати доступом може лише власник документа.
          content:
            application/json:
              example:
                detail: Недостатньо прав для цієї дії.
