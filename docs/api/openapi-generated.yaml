openapi: 3.1.0
info:
  title: NoteLy API
  description: Демонстраційний API для документів, кошика й абзаців NoteLy. Дані зберігаються
    лише в пам'яті та скидаються після перезапуску. Відповіді 401/403 документують
    інтеграційний контракт з IAM; автентифікація в цій заглушці не реалізована.
  version: 1.0.0
paths:
  /api/v1/documents:
    post:
      tags:
      - documents
      summary: Створити документ
      description: Створює документ з обмеженим доступом. Заголовок Idempotency-Key
        обов'язковий. Повтор із тим самим ключем і тією самою назвою повертає той
        самий документ зі статусом 201; повторне використання ключа з іншою назвою
        повертає 409.
      operationId: create_document_api_v1_documents_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Унікальний ключ для безпечного повтору запиту створення.
          examples:
          - create-document-request-001
          title: Idempotency-Key
        description: Унікальний ключ для безпечного повтору запиту створення.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/DocumentCreate'
              - type: 'null'
              title: Payload
      responses:
        '201':
          description: Документ створено або повернено результат попереднього запиту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '409':
          description: Ключ ідемпотентності вже використаний з іншим вмістом запиту.
          content:
            application/json:
              example:
                detail: Idempotency-Key вже використаний з іншою назвою документа.
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Не автентифіковано: відсутній або недійсний токен.'
          content:
            application/json:
              example:
                detail: Потрібна автентифікація.
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Недостатньо прав для виконання цієї дії.
          content:
            application/json:
              example:
                detail: Недостатньо прав для цієї дії.
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Вхідні дані не пройшли валідацію.
          content:
            application/json:
              example:
                detail: Некоректні вхідні дані.
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
      - documents
      summary: Отримати список документів
      description: Повертає сторінку активних документів; документи з кошика не включаються.
      operationId: list_documents_api_v1_documents_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Максимальна кількість документів у відповіді.
          examples:
          - 20
          default: 20
          title: Limit
        description: Максимальна кількість документів у відповіді.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Кількість активних документів, які потрібно пропустити.
          examples:
          - 0
          default: 0
          title: Offset
        description: Кількість активних документів, які потрібно пропустити.
      responses:
        '200':
          description: Список документів отримано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsResponse'
        '401':
          description: 'Не автентифіковано: відсутній або недійсний токен.'
          content:
            application/json:
              example:
                detail: Потрібна автентифікація.
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Недостатньо прав для виконання цієї дії.
          content:
            application/json:
              example:
                detail: Недостатньо прав для цієї дії.
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Вхідні дані не пройшли валідацію.
          content:
            application/json:
              example:
                detail: Некоректні вхідні дані.
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/documents/trash:
    get:
      tags:
