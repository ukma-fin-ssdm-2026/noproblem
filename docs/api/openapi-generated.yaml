        schema:
          type: integer
          minimum: 0
          description: Кількість документів кошика, які потрібно пропустити.
          examples:
          - 0
          default: 0
          title: Offset
        description: Кількість документів кошика, які потрібно пропустити.
      responses:
        '200':
          description: Кошик отримано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResponse'
        '401':
          description: 'Не автентифіковано: відсутній або недійсний токен.'
