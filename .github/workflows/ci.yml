name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Black (format check)
        run: black --check .
      - name: Flake8 (style)
        run: flake8 .
      - name: Bandit (security, medium and above)
        run: bandit -r src -ll

      - name: Pytest
        run: pytest -q

