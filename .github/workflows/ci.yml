name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, linux]
    # PostgreSQL для тестів адаптерів (ADR-002). GitHub піднімає його в
    # контейнері на час роботи job; на self-hosted раннері для цього
    # потрібен Docker. База одноразова (живе лише під час job і містить
    # тільки тестові дані), тому входить без пароля (trust) — так у коді
    # немає жодного пароля. Для production так робити не можна.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notely
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: notely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notely -d notely_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # У CI одна одноразова база, і вона ж тестова.
      DATABASE_URL: postgresql://notely@localhost:5432/notely_test
      TEST_DATABASE_URL: postgresql://notely@localhost:5432/notely_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Лише готові wheel-и з PyPI: під час встановлення не виконується
      # жоден setup.py (раннер self-hosted). Ті самі параметри — у
      # deploy-api-docs.yml.
      - name: Upgrade pip
        run: 'python -m pip install --upgrade pip --only-binary :all: --index-url https://pypi.org/simple'
      - name: Install dependencies
        run: 'pip install -r requirements-dev.txt --only-binary :all: --index-url https://pypi.org/simple'
      - name: Black (format check)
        run: black --check .
      - name: Flake8 (style)
        run: flake8 .
      - name: Bandit (security, medium and above)
        run: bandit -r src -ll

      - name: Apply database migrations
        run: python -m src.db.migrate

      - name: Pytest (tests and coverage)
        run: pytest --cov --cov-report=term-missing -q
      
      # pip-audit уже встановлено з requirements-dev.txt (зафіксована
      # версія), окремо не встановлюємо.
      - name: pip-audit
        run: pip-audit -r requirements.txt
