# Локальна база PostgreSQL для розробки й тестів (ADR-002).
#
#   docker compose up -d     — запустити у фоні
#   docker compose down      — зупинити (дані лишаються в томі)
#   docker compose down -v   — зупинити й стерти всі дані
#
# Пароль у коді не зберігається: Docker Compose бере POSTGRES_PASSWORD
# з файла .env поруч (він у .gitignore). Як його створити й задати
# DATABASE_URL — у README, розділ «База даних (PostgreSQL)».
#
# Порт відкрито лише для цього комп'ютера (127.0.0.1), не для мережі.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у файлі .env (див. README)}
      POSTGRES_DB: notely
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - notely-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notely -d notely"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notely-db:

