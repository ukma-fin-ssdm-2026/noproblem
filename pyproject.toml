[tool.pytest.ini_options]
# Корінь репозиторію в sys.path, тож імпорти «from src...» працюють
# без ручного PYTHONPATH.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "req(requirement_id): links a test to a functional or non-functional requirement",
]

[tool.bandit]
# Тести навмисно містять assert (B101) і тестові паролі.
exclude_dirs = ["tests", ".venv"]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.coverage.run]
# Вимірюємо лише код застосунку; branch = true рахує й гілки if/else,
# а не тільки рядки.
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# Нижче цього порогу «pytest --cov» завершується з помилкою (і в CI).
fail_under = 90

[tool.coverage.html]
directory = "htmlcov"
title = "NoteLy — звіт покриття тестами"
