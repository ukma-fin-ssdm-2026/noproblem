[tool.pytest.ini_options]
# Корінь репозиторію в sys.path, тож імпорти «from src...» працюють
# без ручного PYTHONPATH.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.bandit]
# Тести навмисно містять assert (B101) і тестові паролі.
exclude_dirs = ["tests", ".venv"]

[tool.black]
line-length = 79
target-version = ["py312"]